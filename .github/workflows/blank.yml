
name: Basketball Data Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install HTML parser
        run: pip install beautifulsoup4

      - name: Extract women's basketball fixtures
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone
          from bs4 import BeautifulSoup

          url = "https://hunbasket.hu/menetrend/noi/x2627/whun"

          request = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read()

          soup = BeautifulSoup(html, "html.parser")
          matches = []

          for table in soup.find_all("table"):
              for row in table.find_all("tr"):
                  cells = [
                      c.get_text(" ", strip=True)
                      for c in row.find_all(["th", "td"])
                  ]

                  if len(cells) < 5:
                      continue

                  # Expect round, home team, score,
                  # away team, date, optionally time.
                  if not re.match(r"^\d+\.?$", cells[0]):
                      continue

                  if not re.search(r"20\d{2}", " ".join(cells)):
                      continue

                 

                  matches.append({
                      "round": cells[0],
                      "home": cells[2],
                      "result": cells[3],
                      "away": cells[4],
                      "date": cells[5] if len(cells) > 5 else "",
                      "time": cells[6] if len(cells) > 6 else ""
                  })


          if not matches:
              raise RuntimeError("No matches extracted")

          output = {
              "source": url,
              "fetched_at": datetime.now(timezone.utc).isoformat(),
              "competition": "Női NB I/A",
              "matches": matches
          }

          with open("data/women.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print("Extracted matches:", len(matches))
          print("First three records:")
          print(json.dumps(matches[:3], ensure_ascii=False, indent=2))
          PY

      - name: Save test data
        uses: actions/upload-artifact@v4
        with:
          name: women-basketball-data
          path: data/women.json
