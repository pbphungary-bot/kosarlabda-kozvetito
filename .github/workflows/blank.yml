
name: Basketball Data Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test official basketball sources
        run: |
          python3 - <<'PY'
          import urllib.request

          sources = {
              "Men's standings": "https://hunbasket.hu/tabella/ferfi",
              "Women's fixtures": "https://hunbasket.hu/menetrend/noi/x2627/whun",
              "Combined fixtures": "https://hunbasket.hu/osszevont-menetrend-teljes/x2627",
          }

          for name, url in sources.items():
              print(f"\nChecking {name}: {url}")
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      content = response.read()
                      print("HTTP status:", response.status)
                      print("Downloaded bytes:", len(content))
                      print("Contains HTML:", b"<html" in content.lower())
              except Exception as error:
                  print("FAILED:", error)
          PY
