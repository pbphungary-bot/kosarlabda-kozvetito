
name: Basketball Data Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: basketball-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install HTML parser
        run: pip install beautifulsoup4

      - name: Update basketball data
        run: python3 scripts/update_basketball.py

      - name: Save updated data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/men.json data/women.json data/standings_men.json data/standings_women.json

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Update basketball data"
            git pull --rebase origin main
            git push
          fi

      - name: Save data backup
        uses: actions/upload-artifact@v4
        with:
          name: basketball-data
          path: |
            data/men.json
            data/women.json
            data/standings_men.json
            data/standings_women.json
