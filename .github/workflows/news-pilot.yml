name: Basketball News Pilot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: basketball-news-pilot
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4

      - name: Collect news (isolated pilot)
        run: python scripts/update_news.py

      - name: Show news collection results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/news.json')
          if not p.exists():
              raise SystemExit('data/news.json was not created')
          d = json.loads(p.read_text(encoding='utf-8'))
          print('Total saved articles:', len(d.get('articles', [])))
          h = json.loads(Path('data/news_health.json').read_text(encoding='utf-8'))
          print('News health:', h['status'])
          print('Statistics:', h['statistics'])
          for s in h.get('sources', []):
              print(s['source'], s['status'], 'candidates:', s.get('candidates', 0), 'errors:', s.get('article_errors', 0))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Basketball news collector\n\n')
              f.write('Status: **' + h['status'] + '**\n\n')
              f.write('| Source | Status | Candidates | Article errors |\n|---|---|---:|---:|\n')
              for s in h.get('sources', []):
                  f.write(f"| {s['source']} | {s['status']} | {s.get('candidates', 0)} | {s.get('article_errors', 0)} |\n")
              f.write('\n### Quality metrics\n')
              for key, value in h['statistics'].items():
                  f.write(f'- {key}: {value}\n')
          PY

      - name: Commit news data and health diagnostics only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/news_health.json
          if git diff --cached --quiet; then
            echo 'No news data changes'
            exit 0
          fi
          git commit -m 'Update basketball news pilot data'
          for attempt in 1 2 3; do
            if git push; then
              echo 'News data pushed successfully'
              exit 0
            fi
            echo "Push conflicted (attempt $attempt); rebasing and retrying"
            git fetch origin main
            git rebase origin/main
          done
          echo 'Unable to push news data after three attempts' >&2
          exit 1
