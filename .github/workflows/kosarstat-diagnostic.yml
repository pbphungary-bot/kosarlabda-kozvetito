name: Kosarstat page diagnostic
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Inspect public Kosarstat page
        run: python scripts/inspect_kosarstat.py
      - name: Downloadable page diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosarstat-page-diagnostic
          path: kosarstat_diagnostic/
          if-no-files-found: warn
