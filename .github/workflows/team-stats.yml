name: Basketball team statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,12,18 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas lxml beautifulsoup4
      - name: Update Kosarstat men's statistics
        run: python scripts/update_team_stats.py --league men
      - name: Commit successful updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/team_stats_men.json
          git diff --cached --quiet || (git commit -m 'Update Kosarstat team stats' && git push)
