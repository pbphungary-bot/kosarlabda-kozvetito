name: Hunbasket Team Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '50 5,17 * * *'
permissions:
  contents: write
concurrency:
  group: basketball-team-pages
  cancel-in-progress: false
jobs:
  team-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Read rosters, records, zones and the full statistic tables
        run: python scripts/update_team_pages.py
      - name: Commit changed team page data
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/team_pages_men.json data/team_pages_women.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Hunbasket team pages'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
