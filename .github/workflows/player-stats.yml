name: Official Hunbasket Player Stats (daily)
on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: write
concurrency:
  group: basketball-player-stats
  cancel-in-progress: false
jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Collect player statistics
        run: python scripts/update_player_stats.py --require-complete
      - name: Commit verified player statistics only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/player_stats_men.json data/player_stats_women.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Hunbasket player statistics'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
