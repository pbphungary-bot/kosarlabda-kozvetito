name: European and Cup Games
on:
  workflow_dispatch:
  schedule:
    - cron: '40 5,11,17 * * *'
permissions:
  contents: write
concurrency:
  group: basketball-cups
  cancel-in-progress: false
jobs:
  cups:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read European games from the official FIBA / Champions League pages
        run: node scripts/update_cups.mjs
      - name: Commit changed cup data
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cups_men.json data/cups_women.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh European and cup games'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
