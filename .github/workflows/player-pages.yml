name: Hunbasket Player Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'
permissions:
  contents: write
concurrency:
  group: basketball-player-pages
  cancel-in-progress: false
jobs:
  player-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Read season statistics, game logs and careers of every player
        run: python scripts/update_player_pages.py
      - name: Commit changed player page data
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/player_pages_men.json data/player_pages_women.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Hunbasket player pages'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
