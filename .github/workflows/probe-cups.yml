name: Probe cup data sources (temporary)
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/probe/**', '.github/workflows/probe-cups.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/probe3.py
