name: Probe player photos (temporary)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/probe/photos.py', '.github/workflows/probe-photos.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow beautifulsoup4
      - run: python .github/probe/photos.py
