name: Hunbasket Referees and Arenas
on:
  workflow_dispatch:
  schedule:
    - cron: '25,55 * * * *'
permissions:
  contents: write
concurrency:
  group: basketball-referees
  cancel-in-progress: false
jobs:
  referees:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Read referees, MKOSZ controller and arena from the full schedule
        run: python scripts/update_referees.py
      - name: Commit changed referee data
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/referees_men.json data/referees_women.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Hunbasket referees and arenas'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
