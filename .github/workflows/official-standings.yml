name: Official Hunbasket Standings (30 minutes)
on:
  workflow_dispatch:
  schedule:
    - cron: '5,35 * * * *'
permissions:
  contents: write
concurrency:
  group: basketball-official-standings
  cancel-in-progress: false
jobs:
  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Fetch official men's and women's standings
        run: python scripts/update_standings.py
      - name: Commit only verified official standings
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/standings_men.json data/standings_women.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh official Hunbasket standings'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
